version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: github_tracker_backend
    environment:
      - DATABASE_URL=sqlite:///./tracker.db
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: github_tracker_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
